<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#151118" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <title>BG Planner</title>
    <!--
      Cáscara local empaquetada en el binario. Con `server.url` apuntando a
      https://bgplanner.app esta página normalmente no llega a verse: el WebView
      carga el dominio remoto directamente. Existe porque Capacitor exige un
      index.html en `webDir`, y sirve de red de seguridad si algún día se quita
      `server.url` o el WebView cae aquí por cualquier motivo.
      Sin recursos externos: todo inline.
    -->
    <style>
      /* Paleta de la app (misma que src/app/globals.css). Oscuro por defecto. */
      :root {
        --bg: #151118;
        --surface: #23202b;
        --border: #3a3548;
        --text: #f0ece8;
        --text-secondary: #a09890;
        --primary: #e8a840;
        --primary-text: #151118;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf8f5;
          --surface: #ffffff;
          --border: #e8e0d8;
          --text: #1a1612;
          --text-secondary: #5c534a;
          --primary: #c87a1a;
          --primary-text: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui,
          sans-serif;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }

      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        color: var(--primary);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.9375rem;
      }

      .spinner {
        width: 22px;
        height: 22px;
        margin: 24px auto 0;
        border: 2px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }

      #fallback {
        display: none;
        margin-top: 28px;
      }

      #fallback button {
        width: 100%;
        min-height: 48px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2.5" y="2.5" width="19" height="19" rx="4" />
          <circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="8" cy="16" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </div>

      <h1>BG Planner</h1>
      <p>Abriendo tu mesa de juego…</p>
      <div class="spinner" role="status" aria-label="Cargando"></div>

      <div id="fallback">
        <p>No hay conexión ahora mismo.</p>
        <button id="retry" type="button">Reintentar</button>
      </div>
    </main>

    <script>
      (function () {
        var APP_URL = "https://bgplanner.app";

        function go() {
          window.location.replace(APP_URL);
        }

        if (navigator.onLine === false) {
          // Sin red: no intentamos navegar (daría error) y ofrecemos reintentar.
          document.querySelector(".spinner").style.display = "none";
          document.getElementById("fallback").style.display = "block";
          document.getElementById("retry").addEventListener("click", go);
          window.addEventListener("online", go);
          return;
        }

        // Pequeño respiro para que se pinte la cáscara antes de saltar al dominio.
        window.setTimeout(go, 300);
      })();
    </script>
  </body>
</html>
