<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#151118" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <title>Sin conexión · BG Planner</title>
    <style>
      /* Paleta de la app (misma que src/app/globals.css). Oscuro por defecto. */
      :root {
        --bg: #151118;
        --surface: #23202b;
        --border: #3a3548;
        --text: #f0ece8;
        --text-secondary: #a09890;
        --primary: #e8a840;
        --primary-text: #151118;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf8f5;
          --surface: #ffffff;
          --border: #e8e0d8;
          --text: #1a1612;
          --text-secondary: #5c534a;
          --primary: #c87a1a;
          --primary-text: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui,
          sans-serif;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }

      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        color: var(--primary);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 28px;
        color: var(--text-secondary);
        font-size: 0.975rem;
      }

      button {
        width: 100%;
        min-height: 48px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }

      button:active {
        opacity: 0.85;
      }

      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }

      .hint {
        margin: 16px 0 0;
        font-size: 0.8125rem;
        color: var(--text-secondary);
        min-height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 2 L22 22" />
          <path d="M5 12.55a11 11 0 0 1 5.2-2.4" />
          <path d="M1.42 9a16 16 0 0 1 5.3-3.35" />
          <path d="M16.85 11.25a11 11 0 0 1 2.15 1.3" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <path d="M12 20h.01" />
        </svg>
      </div>

      <h1>Sin conexión</h1>
      <p>
        No hemos podido conectar con BG Planner. Comprueba tu conexión a internet
        y vuelve a intentarlo.
      </p>

      <button id="retry" type="button">Reintentar</button>
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
    </main>

    <script>
      (function () {
        var APP_URL = "https://bgplanner.app";
        var retry = document.getElementById("retry");
        var hint = document.getElementById("hint");

        function go() {
          retry.disabled = true;
          hint.textContent = "Conectando…";
          // replace() para no dejar la pantalla de error en el historial
          window.location.replace(APP_URL);
          // Si en 6 s seguimos aquí es que no ha habido suerte: reactivar el botón.
          window.setTimeout(function () {
            retry.disabled = false;
            hint.textContent = "Seguimos sin conexión.";
          }, 6000);
        }

        retry.addEventListener("click", go);

        // Reintento automático en cuanto el sistema recupere la red.
        window.addEventListener("online", go);
      })();
    </script>
  </body>
</html>
